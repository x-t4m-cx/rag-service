services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:?OLLAMA_API_KEY is required}
      WEBSEARCH_ENABLED: ${WEBSEARCH_ENABLED:-false}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
    depends_on:
      qdrant:
        condition: service_healthy

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://app:8080/v1
      OPENAI_API_KEY: rag-local-key
      WEBUI_NAME: RAG Service
    depends_on:
      - app
    volumes:
      - open_webui_data:/app/backend/data

  searxng:
    profiles:
      - websearch
    image: searxng/searxng:latest
    ports:
      - "8081:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8081/

volumes:
  qdrant_data:
  open_webui_data:
